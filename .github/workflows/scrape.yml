name: Scrape montpellier-municipales.fr

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py --output-dir output --delay 1.0

      - name: Generate analysis prompt
        run: python analyze.py --output-dir output --output-file analysis_prompt.md

      - name: Commit and push scraped data and analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/
          git add analysis_prompt.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update scraped data and analysis [skip ci]"
            git push
          fi
